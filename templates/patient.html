<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<title>Farmamed — Patiënten</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=Cormorant+Garamond:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --teal: #2a7f7f; --teal-dk: #1d5c5c; --teal-lt: #e8f5f5;
    --border: #dde8e8; --muted: #7a9a9a; --cream: #f7fafa;
    --success: #27ae60; --warn: #e67e22; --danger: #c0392b;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'DM Sans', sans-serif; background: var(--cream); color: #2c3e50; }
  nav { background: var(--teal-dk); color: white; display: flex; align-items: center; height: 48px; }
  nav a { color: white; text-decoration: none; padding: 0 18px; height: 100%; display: flex; align-items: center; font-size: 13px; transition: background 0.15s; }
  nav a:hover, nav a.actief { background: rgba(255,255,255,0.15); }
  nav .logo { font-family: 'Cormorant Garamond', serif; font-size: 18px; padding: 0 20px; border-right: 1px solid rgba(255,255,255,0.2); }

  .layout { display: grid; grid-template-columns: 320px 1fr; height: calc(100vh - 48px); }

  /* Linker kolom: zoeken */
  .zoek-paneel { border-right: 1px solid var(--border); display: flex; flex-direction: column; background: white; }
  .zoek-header { padding: 16px; border-bottom: 1px solid var(--border); }
  .zoek-header h2 { font-family: 'Cormorant Garamond', serif; font-size: 20px; font-weight: 400; margin-bottom: 10px; }
  .zoek-input { width: 100%; padding: 9px 12px; border: 1px solid var(--border); border-radius: 8px; font-family: 'DM Sans', sans-serif; font-size: 13px; outline: none; }
  .zoek-input:focus { border-color: var(--teal); }
  .zoek-hint { font-size: 11px; color: var(--muted); margin-top: 6px; }

  .patient-lijst { flex: 1; overflow-y: auto; }
  .patient-item { padding: 12px 16px; border-bottom: 1px solid var(--border); cursor: pointer; transition: background 0.1s; }
  .patient-item:hover { background: var(--teal-lt); }
  .patient-item.actief { background: var(--teal-lt); border-left: 3px solid var(--teal); }
  .patient-item .naam { font-size: 13px; font-weight: 600; }
  .patient-item .sub { font-size: 11px; color: var(--muted); margin-top: 2px; }
  .patient-item .bsn-badge { display: inline-block; font-size: 10px; padding: 1px 5px; border-radius: 4px; margin-top: 3px; }
  .bsn-ja { background: #eafaf1; color: var(--success); }
  .bsn-nee { background: #fef9e7; color: var(--warn); }

  /* Rechter kolom: datasheet */
  .datasheet { overflow-y: auto; padding: 24px; }
  .leeg { display: flex; align-items: center; justify-content: center; height: 100%; color: var(--muted); font-size: 14px; }

  .patient-header { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 20px; }
  .patient-naam { font-family: 'Cormorant Garamond', serif; font-size: 28px; font-weight: 400; }
  .patient-sub { font-size: 13px; color: var(--muted); margin-top: 4px; }

  .sectie { background: white; border: 1px solid var(--border); border-radius: 10px; padding: 16px; margin-bottom: 16px; }
  .sectie h3 { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); margin-bottom: 12px; }
  .velden-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .veld { }
  .veld label { font-size: 11px; color: var(--muted); display: block; margin-bottom: 2px; }
  .veld input { width: 100%; padding: 6px 10px; border: 1px solid var(--border); border-radius: 6px; font-family: 'DM Sans', sans-serif; font-size: 13px; background: var(--cream); }
  .veld input:focus { outline: none; border-color: var(--teal); background: white; }
  .veld input.ontbreekt { border-color: var(--warn); background: #fffbf0; }

  .btn-opslaan { padding: 8px 16px; background: var(--teal); color: white; border: none; border-radius: 8px; cursor: pointer; font-family: 'DM Sans', sans-serif; font-size: 13px; margin-top: 12px; }
  .btn-opslaan:hover { background: var(--teal-dk); }
  .btn-verwijderen { padding: 8px 16px; background: white; color: var(--danger); border: 1px solid var(--danger); border-radius: 8px; cursor: pointer; font-family: 'DM Sans', sans-serif; font-size: 13px; margin-top: 12px; margin-left: 8px; }
  .btn-verwijderen:hover { background: #fdecea; }

  /* Orders tabel */
  .orders-tabel { width: 100%; border-collapse: collapse; font-size: 12px; }
  .orders-tabel th { text-align: left; padding: 8px 10px; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); border-bottom: 2px solid var(--border); }
  .orders-tabel td { padding: 10px; border-bottom: 1px solid var(--border); vertical-align: top; }
  .orders-tabel tr:hover td { background: var(--teal-lt); }
  .status-badge { font-size: 10px; padding: 2px 6px; border-radius: 4px; }
  .status-completed { background: #eafaf1; color: var(--success); }
  .status-pending { background: #fef9e7; color: var(--warn); }
  .status-cancelled { background: #fdecea; color: var(--danger); }
  .smarthub-ja { color: var(--success); }
  .smarthub-nee { color: #ccc; }

  .wc-link { color: var(--teal); text-decoration: none; font-size: 11px; }
  .wc-link:hover { text-decoration: underline; }
</style>
</head>
<body>

<nav>
  <div class="logo">Farmamed</div>
  <a href="/">Balie</a>
  <a href="/orders">Orders</a>
  <a href="/emails">E-mails</a>
  <a href="/status">Werklijst</a>
  <a href="/bank">Bank</a>
  <a href="/patient" class="actief">Patiënten</a>
</nav>

<div class="layout">
  <!-- Zoekpaneel -->
  <div class="zoek-paneel">
    <div class="zoek-header">
      <h2>Patiënten</h2>
      <input type="text" class="zoek-input" id="zoekInput" placeholder="Naam, email, telefoon, BSN…" oninput="zoek(this.value)">
      <div class="zoek-hint" id="zoekHint">Typ minimaal 2 tekens om te zoeken</div>
    </div>
    <div class="patient-lijst" id="patientLijst"></div>
  </div>

  <!-- Datasheet -->
  <div class="datasheet" id="datasheet">
    <div class="leeg">← Zoek en selecteer een patiënt</div>
  </div>
</div>

<script>
  let zoekTimeout = null;
  let huidigePatient = null;

  async function zoek(q) {
    clearTimeout(zoekTimeout);
    if (q.length < 2) {
      document.getElementById('patientLijst').innerHTML = '';
      document.getElementById('zoekHint').textContent = 'Typ minimaal 2 tekens om te zoeken';
      return;
    }
    zoekTimeout = setTimeout(async () => {
      const resp = await fetch(`/api/zoek-patient?q=${encodeURIComponent(q)}`);
      const data = await resp.json();
      const lijst = document.getElementById('patientLijst');
      const patienten = data.patienten || [];
      document.getElementById('zoekHint').textContent = `${patienten.length} patiënt${patienten.length !== 1 ? 'en' : ''} gevonden`;
      lijst.innerHTML = patienten.map(p => `
        <div class="patient-item ${p.id === null ? 'wc-only' : ''}" onclick="${p.id === null ? 'toonWcAlleen(this)' : `toonPatient(${p.id})`}">
          <div class="naam">${p.voornaam || ''} ${p.achternaam || ''} ${p.id === null ? '<span style="font-size:10px;color:var(--warn);font-weight:400;">(alleen WooCommerce)</span>' : ''}</div>
          <div class="sub">${p.email || ''}</div>
          <div class="sub">${p.telefoon || ''} ${p.plaats ? '· ' + p.plaats : ''}</div>
          <span class="bsn-badge ${p.bsn ? 'bsn-ja' : 'bsn-nee'}">${p.bsn ? '✓ BSN' : '○ BSN ontbreekt'}</span>
        </div>
      `).join('');
    }, 300);
  }

  function toonWcAlleen(el) {
    document.querySelectorAll('.patient-item').forEach(e => e.classList.remove('actief'));
    el.classList.add('actief');
    document.getElementById('datasheet').innerHTML = `
      <div class="leeg" style="flex-direction:column;gap:8px;">
        <div>⚠ Dit resultaat komt alleen uit WooCommerce, nog geen lokaal patiëntdossier.</div>
        <div style="font-size:12px;">Er is nog geen order voor deze persoon lokaal verwerkt — het dossier ontstaat automatisch zodra dat gebeurt.</div>
      </div>`;
  }

  async function toonPatient(id) {
    // Markeer actief in lijst
    document.querySelectorAll('.patient-item').forEach(el => el.classList.remove('actief'));
    event.currentTarget.classList.add('actief');

    const resp = await fetch(`/api/patient/${id}`);
    const p = await resp.json();
    huidigePatient = p;

    const ds = document.getElementById('datasheet');
    ds.innerHTML = `
      <div class="patient-header">
        <div>
          <div class="patient-naam">${p.voornaam || ''} ${p.achternaam || ''}</div>
          <div class="patient-sub">
            ${p.email || '—'} &nbsp;·&nbsp; ${p.telefoon || '—'}
            &nbsp;·&nbsp; ${p.orders?.length || 0} order${(p.orders?.length || 0) !== 1 ? 's' : ''}
          </div>
        </div>
        <a href="https://farmamed.nl/wp-admin/edit.php?post_type=shop_order&s=${encodeURIComponent(p.email || '')}"
           target="_blank" class="wc-link">Bekijk in WooCommerce ↗</a>
      </div>

      <!-- Patiëntgegevens -->
      <div class="sectie">
        <h3>Patiëntgegevens</h3>
        <div class="velden-grid">
          <div class="veld">
            <label>Voornaam</label>
            <input id="f-voornaam" value="${p.voornaam || ''}" placeholder="Voornaam">
          </div>
          <div class="veld">
            <label>Achternaam</label>
            <input id="f-achternaam" value="${p.achternaam || ''}" placeholder="Achternaam">
          </div>
          <div class="veld">
            <label>E-mailadres</label>
            <input value="${p.email || ''}" readonly style="color:var(--muted)">
          </div>
          <div class="veld">
            <label>Telefoon</label>
            <input id="f-telefoon" value="${p.telefoon || ''}" placeholder="Telefoonnummer">
          </div>
          <div class="veld">
            <label>Geboortedatum</label>
            <input id="f-geboortedatum" value="${p.geboortedatum || ''}" placeholder="YYYY-MM-DD" class="${!p.geboortedatum ? 'ontbreekt' : ''}">
          </div>
          <div class="veld">
            <label>BSN</label>
            <input id="f-bsn" value="${p.bsn || ''}" placeholder="BSN nummer" class="${!p.bsn ? 'ontbreekt' : ''}">
          </div>
          <div class="veld">
            <label>Adres</label>
            <input id="f-adres" value="${p.adres || ''}" placeholder="Straat en huisnummer">
          </div>
          <div class="veld">
            <label>Postcode · Plaats</label>
            <input id="f-postcode" value="${(p.postcode || '') + (p.plaats ? ' ' + p.plaats : '')}" placeholder="1234AB Plaatsnaam" readonly style="color:var(--muted)">
          </div>
        </div>
        <button class="btn-opslaan" onclick="slaOp(${p.id})">Opslaan</button>
        <button class="btn-verwijderen" onclick="verwijderPatient(${p.id}, '${(p.voornaam || '').replace(/'/g, "\\'")} ${(p.achternaam || '').replace(/'/g, "\\'")}')">Verwijderen</button>
        <span id="opslaan-status" style="font-size:12px;margin-left:10px;"></span>
      </div>

      <!-- Orders -->
      <div class="sectie">
        <h3>Bestellingen (${p.orders?.length || 0})</h3>
        ${!p.orders?.length ? '<div style="color:var(--muted);font-size:13px;">Geen orders gevonden</div>' : `
        <table class="orders-tabel">
          <thead>
            <tr>
              <th>Order</th>
              <th>Datum</th>
              <th>Medicijn</th>
              <th>Voorschrijver</th>
              <th>Bedrag</th>
              <th>Status</th>
              <th>SmartHUB</th>
            </tr>
          </thead>
          <tbody>
            ${p.orders.map(o => `
              <tr>
                <td><a href="https://farmamed.nl/wp-admin/post.php?post=${o.wc_order_id}&action=edit" target="_blank" class="wc-link">#${o.wc_order_id}</a></td>
                <td>${o.wc_datum || '—'}</td>
                <td style="max-width:160px;font-size:11px;">${o.medicijn || '—'}</td>
                <td style="font-size:11px;">${o.voorschrijver || '—'}</td>
                <td>€${o.wc_totaal || '—'}</td>
                <td><span class="status-badge status-${o.wc_status}">${o.wc_status || '—'}</span></td>
                <td class="${o.smarthub_verstuurd ? 'smarthub-ja' : 'smarthub-nee'}">${o.smarthub_verstuurd ? '✓' : '○'}</td>
              </tr>
            `).join('')}
          </tbody>
        </table>`}
      </div>
    `;
  }

  async function slaOp(patient_id) {
    const status = document.getElementById('opslaan-status');
    const data = {
      voornaam: document.getElementById('f-voornaam').value,
      achternaam: document.getElementById('f-achternaam').value,
      telefoon: document.getElementById('f-telefoon').value,
      geboortedatum: document.getElementById('f-geboortedatum').value,
      bsn: document.getElementById('f-bsn').value,
      adres: document.getElementById('f-adres').value,
    };
    const resp = await fetch(`/api/patient/${patient_id}`, {
      method: 'PUT',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(data)
    });
    const result = await resp.json();
    if (result.ok) {
      status.style.color = 'var(--success)';
      status.textContent = '✓ Opgeslagen';
      setTimeout(() => status.textContent = '', 3000);
    } else {
      status.style.color = 'var(--danger)';
      status.textContent = '✗ ' + (result.fout || 'Fout');
    }
  }

  async function verwijderPatient(patient_id, naam, samenvoegenMet) {
    if (!samenvoegenMet && !confirm(`Weet je zeker dat je "${naam.trim()}" (patiënt #${patient_id}) wilt verwijderen? Dit kan niet ongedaan worden gemaakt.`)) {
      return;
    }
    const status = document.getElementById('opslaan-status');
    let url = `/api/patient/${patient_id}`;
    if (samenvoegenMet) url += `?samenvoegen_met=${samenvoegenMet}`;
    const resp = await fetch(url, { method: 'DELETE' });
    const result = await resp.json();

    if (result.ok) {
      status.style.color = 'var(--success)';
      status.textContent = `✓ Verwijderd${result.orders_verplaatst ? ` (${result.orders_verplaatst} order(s) verplaatst)` : ''}`;
      setTimeout(() => {
        document.getElementById('datasheet').innerHTML = '<div class="leeg">← Zoek en selecteer een patiënt</div>';
        document.getElementById('zoekInput').value = '';
        document.getElementById('patientLijst').innerHTML = '';
      }, 1200);
    } else if (resp.status === 409 && result.gekoppelde_orders) {
      const idsLijst = result.gekoppelde_orders.join(', ');
      const doel = prompt(
        `Kan niet verwijderen: ${result.gekoppelde_orders.length} order(s) zijn nog gekoppeld aan deze patiënt (order-ID's: ${idsLijst}).\n\n` +
        `Vul het patiënt-ID in waar deze orders naartoe verplaatst moeten worden (het "blijvende" record), of Annuleren om te stoppen:`
      );
      if (doel && !isNaN(parseInt(doel))) {
        verwijderPatient(patient_id, naam, parseInt(doel));
      }
    } else {
      status.style.color = 'var(--danger)';
      status.textContent = '✗ ' + (result.fout || 'Fout');
    }
  }
</script>
</body>
</html>
