<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<title>Farmamed — Patiënten</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=Cormorant+Garamond:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --teal: #2a7f7f; --teal-dk: #1d5c5c; --teal-lt: #e8f5f5;
    --border: #dde8e8; --muted: #7a9a9a; --cream: #f7fafa;
    --success: #27ae60; --warn: #e67e22; --danger: #c0392b;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'DM Sans', sans-serif; background: var(--cream); color: #2c3e50; font-size: 12px; }
  nav { background: var(--teal-dk); color: white; display: flex; align-items: center; height: 40px; }
  nav a { color: white; text-decoration: none; padding: 0 14px; height: 100%; display: flex; align-items: center; font-size: 12px; transition: background 0.15s; }
  nav a:hover, nav a.actief { background: rgba(255,255,255,0.15); }
  nav .logo { font-family: 'Cormorant Garamond', serif; font-size: 17px; padding: 0 16px; border-right: 1px solid rgba(255,255,255,0.2); }

  .layout { display: grid; grid-template-columns: 220px 1fr; height: calc(100vh - 40px); }
  .zoek-paneel { border-right: 1px solid var(--border); display: flex; flex-direction: column; background: white; min-height: 0; }
  .zoek-header { padding: 10px; border-bottom: 1px solid var(--border); }
  .zoek-header h2 { font-family: 'Cormorant Garamond', serif; font-size: 17px; font-weight: 500; margin-bottom: 6px; }
  .zoek-input { width: 100%; padding: 6px 9px; border: 1px solid var(--border); border-radius: 6px; font-family: inherit; font-size: 12px; outline: none; }
  .zoek-input:focus { border-color: var(--teal); }
  .zoek-hint { font-size: 10px; color: var(--muted); margin-top: 4px; }
  .patient-lijst { flex: 1; overflow-y: auto; }
  .patient-item { padding: 7px 10px; border-bottom: 1px solid var(--border); cursor: pointer; }
  .patient-item:hover { background: var(--teal-lt); }
  .patient-item.actief { background: var(--teal-lt); border-left: 3px solid var(--teal); }
  .patient-item .naam { font-size: 12px; font-weight: 600; }
  .patient-item .sub { font-size: 10px; color: var(--muted); }
  .bsn-badge { display: inline-block; font-size: 9px; padding: 0 4px; border-radius: 3px; margin-top: 2px; }
  .bsn-ja { background: #eafaf1; color: var(--success); }
  .bsn-nee { background: #fef9e7; color: var(--warn); }

  .datasheet { overflow-y: auto; padding: 10px 14px; min-height: 0; }
  .leeg { display: flex; align-items: center; justify-content: center; height: 100%; color: var(--muted); font-size: 13px; }

  .patient-header { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; flex-wrap: wrap; }
  .patient-naam { font-family: 'Cormorant Garamond', serif; font-size: 22px; font-weight: 500; line-height: 1; }
  .nr-badge { background: var(--teal-dk); color: white; font-size: 10px; padding: 2px 7px; border-radius: 10px; font-weight: 600; }
  .patient-sub { font-size: 11px; color: var(--muted); flex: 1; }
  .wc-link { color: var(--teal); text-decoration: none; font-size: 11px; }
  .wc-link:hover { text-decoration: underline; }

  .kolommen { display: grid; grid-template-columns: 3fr 2fr; gap: 10px; margin-bottom: 10px; }
  @media (max-width: 1000px) { .kolommen { grid-template-columns: 1fr; } }
  .sectie { background: white; border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; }
  .sectie h3 { font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); margin-bottom: 6px; display: flex; justify-content: space-between; align-items: center; }
  .velden-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 5px 8px; }
  .velden-grid.twee { grid-template-columns: 1fr 1fr; }
  .veld.breed { grid-column: span 2; }
  .veld label { font-size: 10px; color: var(--muted); display: block; margin-bottom: 1px; }
  .veld input { width: 100%; padding: 3px 6px; border: 1px solid var(--border); border-radius: 4px; font-family: inherit; font-size: 12px; background: var(--cream); }
  .veld input:focus { outline: none; border-color: var(--teal); background: white; }
  .veld input.ontbreekt { border-color: var(--warn); background: #fffbf0; }
  .veld input[readonly] { color: var(--muted); }

  .rij-acties { display: flex; align-items: center; gap: 6px; margin-top: 7px; }
  .btn { padding: 4px 11px; border-radius: 5px; cursor: pointer; font-family: inherit; font-size: 11px; border: 1px solid var(--teal); background: var(--teal); color: white; }
  .btn:hover { background: var(--teal-dk); }
  .btn:disabled { opacity: .5; cursor: default; }
  .btn.licht { background: white; color: var(--teal); }
  .btn.licht:hover { background: var(--teal-lt); }
  .btn.gevaar { background: white; color: var(--danger); border-color: var(--danger); }
  .btn.gevaar:hover { background: #fdecea; }
  .status-txt { font-size: 11px; }
  .vs-info { font-size: 10px; color: var(--muted); margin-top: 5px; }
  .vs-geen { font-size: 11px; color: var(--warn); margin-bottom: 5px; }

  .orders-tabel { width: 100%; border-collapse: collapse; font-size: 11px; }
  .orders-tabel th { text-align: left; padding: 3px 6px; font-size: 9px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); border-bottom: 2px solid var(--border); }
  .orders-tabel td { padding: 3px 6px; border-bottom: 1px solid var(--border); vertical-align: middle; }
  .orders-tabel tr:hover td { background: var(--teal-lt); }
  .orders-tabel tr.nieuw td { background: #eafaf1; }
  .orders-scroll { max-height: calc(100vh - 330px); min-height: 90px; overflow-y: auto; }
  .status-badge { font-size: 10px; padding: 1px 5px; border-radius: 3px; background: #eee; }
  .status-completed { background: #eafaf1; color: var(--success); }
  .status-pending { background: #fef9e7; color: var(--warn); }
  .status-processing { background: #e8f0fb; color: #2c6fbb; }
  .status-cancelled { background: #fdecea; color: var(--danger); }
  .smarthub-ja { color: var(--success); } .smarthub-nee { color: #ccc; }
  .melding { border-radius: 6px; padding: 6px 10px; font-size: 11px; margin-bottom: 6px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .melding.ok { background: #eafaf1; border: 1px solid var(--success); color: #1e8449; }
  .melding.fout { background: #fdecea; border: 1px solid var(--danger); color: var(--danger); }
  .melding.waarsch { background: #fef9e7; border: 1px solid var(--warn); color: #b9650f; }
  .melding .x { margin-left: auto; cursor: pointer; color: var(--muted); }
</style>
</head>
<body>

<nav>
  <div class="logo">Farmamed</div>
  <a href="/">Balie</a>
  <a href="/orders">Orders</a>
  <a href="/emails">E-mails</a>
  <a href="/status">Werklijst</a>
  <a href="/bank">Bank</a>
  <a href="/patient" class="actief">Patiënten</a>
</nav>

<div class="layout">
  <!-- Zoekpaneel -->
  <div class="zoek-paneel">
    <div class="zoek-header">
      <h2>Patiënten</h2>
      <input type="text" class="zoek-input" id="zoekInput" placeholder="Naam, email, telefoon, BSN…" oninput="zoek(this.value)">
      <div class="zoek-hint" id="zoekHint">Typ minimaal 2 tekens om te zoeken</div>
    </div>
    <div class="patient-lijst" id="patientLijst"></div>
  </div>

  <!-- Datasheet -->
  <div class="datasheet" id="datasheet">
    <div class="leeg">← Zoek en selecteer een patiënt</div>
  </div>
</div>

<script>
  let zoekTimeout = null;
  let huidigePatient = null;

  async function zoek(q) {
    clearTimeout(zoekTimeout);
    if (q.length < 2) {
      document.getElementById('patientLijst').innerHTML = '';
      document.getElementById('zoekHint').textContent = 'Typ minimaal 2 tekens om te zoeken';
      return;
    }
    zoekTimeout = setTimeout(async () => {
      const resp = await fetch(`/api/zoek-patient?q=${encodeURIComponent(q)}`);
      const data = await resp.json();
      const lijst = document.getElementById('patientLijst');
      const patienten = data.patienten || [];
      document.getElementById('zoekHint').textContent = `${patienten.length} patiënt${patienten.length !== 1 ? 'en' : ''} gevonden`;
      lijst.innerHTML = patienten.map(p => `
        <div class="patient-item ${p.id === null ? 'wc-only' : ''}" onclick="${p.id === null ? 'toonWcAlleen(this)' : `toonPatient(${p.id})`}">
          <div class="naam">${p.voornaam || ''} ${p.achternaam || ''} ${p.id === null ? '<span style="font-size:10px;color:var(--warn);font-weight:400;">(alleen WooCommerce)</span>' : ''}</div>
          <div class="sub">${p.email || ''}</div>
          <div class="sub">${p.telefoon || ''} ${p.plaats ? '· ' + p.plaats : ''}</div>
          <span class="bsn-badge ${p.bsn ? 'bsn-ja' : 'bsn-nee'}">${p.bsn ? '✓ BSN' : '○ BSN ontbreekt'}</span>
        </div>
      `).join('');
    }, 300);
  }

  function toonWcAlleen(el) {
    document.querySelectorAll('.patient-item').forEach(e => e.classList.remove('actief'));
    el.classList.add('actief');
    document.getElementById('datasheet').innerHTML = `
      <div class="leeg" style="flex-direction:column;gap:8px;">
        <div>⚠ Dit resultaat komt alleen uit WooCommerce, nog geen lokaal patiëntdossier.</div>
        <div style="font-size:12px;">Er is nog geen order voor deze persoon lokaal verwerkt — het dossier ontstaat automatisch zodra dat gebeurt.</div>
      </div>`;
  }

  function esc(v) {
    return String(v == null ? '' : v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }
  function fmtDatum(d) { return d ? String(d).slice(0, 10) : '—'; }

  async function toonPatient(id) {
    document.querySelectorAll('.patient-item').forEach(el => el.classList.remove('actief'));
    if (typeof event !== 'undefined' && event && event.currentTarget && event.currentTarget.classList) {
      event.currentTarget.classList.add('actief');
    }
    await laadPatient(id);
  }

  async function laadPatient(id, melding) {
    const resp = await fetch(`/api/patient/${id}`);
    const p = await resp.json();
    huidigePatient = p;
    const orders = p.orders || [];
    const naam = `${p.voornaam || ''} ${p.achternaam || ''}`.trim();
    const naamJs = esc(naam).replace(/'/g, "\\'");

    document.getElementById('datasheet').innerHTML = `
      <div class="patient-header">
        <div class="patient-naam">${esc(naam) || '(naam onbekend)'}</div>
        <span class="nr-badge" title="Patiëntnummer in de database">Patiënt #${p.id}</span>
        <div class="patient-sub">${esc(p.email) || '—'} · ${esc(p.telefoon) || '—'} · ${orders.length} order${orders.length !== 1 ? 's' : ''}</div>
        <a href="https://farmamed.nl/wp-admin/edit.php?post_type=shop_order&s=${encodeURIComponent(p.email || '')}" target="_blank" class="wc-link">WooCommerce ↗</a>
      </div>

      <div id="meldingen"></div>

      <div class="kolommen">
        <div class="sectie">
          <h3>Patiëntgegevens</h3>
          <div class="velden-grid">
            <div class="veld"><label>Voornaam</label><input id="f-voornaam" value="${esc(p.voornaam)}"></div>
            <div class="veld"><label>Achternaam</label><input id="f-achternaam" value="${esc(p.achternaam)}"></div>
            <div class="veld"><label>Geboortedatum</label><input id="f-geboortedatum" value="${esc(p.geboortedatum)}" placeholder="YYYY-MM-DD" class="${!p.geboortedatum ? 'ontbreekt' : ''}"></div>
            <div class="veld"><label>E-mail</label><input value="${esc(p.email)}" readonly></div>
            <div class="veld"><label>Telefoon</label><input id="f-telefoon" value="${esc(p.telefoon)}"></div>
            <div class="veld"><label>BSN</label><input id="f-bsn" value="${esc(p.bsn)}" class="${!p.bsn ? 'ontbreekt' : ''}"></div>
            <div class="veld"><label>Adres</label><input id="f-adres" value="${esc(p.adres)}"></div>
            <div class="veld"><label>Postcode</label><input id="f-postcode" value="${esc(p.postcode)}" placeholder="1234AB"></div>
            <div class="veld"><label>Plaats</label><input id="f-plaats" value="${esc(p.plaats)}"></div>
          </div>
          <div class="rij-acties">
            <button class="btn" onclick="slaOp(${p.id})">Opslaan</button>
            <button class="btn gevaar" onclick="verwijderPatient(${p.id}, '${naamJs}')">Verwijderen</button>
            <span id="opslaan-status" class="status-txt"></span>
          </div>
        </div>

        <div class="sectie">
          <h3>Voorschrijver ${p.voorschrijver_id ? `<span style="font-weight:400;text-transform:none;letter-spacing:0;">id ${p.voorschrijver_id}</span>` : ''}</h3>
          ${!p.voorschrijver_id ? '<div class="vs-geen">Nog geen voorschrijver bekend — vul in om er een te koppelen.</div>' : ''}
          <div class="velden-grid twee">
            <div class="veld breed"><label>Naam</label><input id="v-naam" value="${esc(p.voorschrijver_naam)}" placeholder="Naam voorschrijver"></div>
            <div class="veld"><label>AGB-code</label><input id="v-agb" value="${esc(p.voorschrijver_agb_code)}" placeholder="AGB-code"></div>
            <div class="veld"><label>Telefoon</label><input id="v-telefoon" value="${esc(p.voorschrijver_telefoon)}"></div>
            <div class="veld breed"><label>E-mail</label><input id="v-email" value="${esc(p.voorschrijver_email)}"></div>
          </div>
          <div class="rij-acties">
            <button class="btn" onclick="slaVoorschrijverOp(${p.id})">${p.voorschrijver_id ? 'Voorschrijver opslaan' : 'Voorschrijver koppelen'}</button>
            <span id="vs-status" class="status-txt"></span>
          </div>
          <div class="vs-info">Laatst bekend: ${fmtDatum(p.voorschrijver_datum)}${p.voorschrijver_aantal_patienten > 1 ? ` · ⚠ gedeeld met ${p.voorschrijver_aantal_patienten} patiënten (wijziging geldt voor allen)` : ''}</div>
        </div>
      </div>

      <div class="sectie">
        <h3><span>Bestellingen (${orders.length})</span><span style="font-weight:400;text-transform:none;letter-spacing:0;">Klonen maakt een nieuwe order (in afwachting); daarna kun je de bestelmail sturen</span></h3>
        ${p.wc_fout ? `<div class="melding waarsch">⚠ WooCommerce gaf een fout (${esc(p.wc_fout)}). Hieronder staat wat in de eigen database bekend is; status en bedrag ontbreken dan.</div>` : ''}
        ${!orders.length ? '<div style="color:var(--muted);">Geen orders gevonden</div>' : `
        <div class="orders-scroll"><table class="orders-tabel">
          <thead><tr><th>Order</th><th>Datum</th><th>Medicijn</th><th>Bedrag</th><th>Status</th><th>SH</th><th></th></tr></thead>
          <tbody>
            ${orders.map(o => `
              <tr>
                <td><a href="https://farmamed.nl/wp-admin/post.php?post=${o.wc_order_id}&action=edit" target="_blank" class="wc-link">#${o.wc_order_id}</a></td>
                <td>${fmtDatum(o.wc_datum)}</td>
                <td style="max-width:260px;">${esc(o.medicijn) || '—'}</td>
                <td>${o.wc_totaal ? '€' + esc(o.wc_totaal) : '—'}</td>
                <td><span class="status-badge status-${esc(o.wc_status)}">${esc(o.wc_status) || '—'}</span></td>
                <td class="${o.smarthub_verstuurd ? 'smarthub-ja' : 'smarthub-nee'}">${o.smarthub_verstuurd ? '✓' : '○'}</td>
                <td style="text-align:right;white-space:nowrap;"><button class="btn licht" onclick="kloonOrder(${o.wc_order_id}, this)">Klonen</button></td>
              </tr>`).join('')}
          </tbody>
        </table></div>`}
      </div>
    `;
    if (melding) toonMelding(melding.type, melding.html);
  }

  function toonMelding(type, html) {
    const m = document.getElementById('meldingen');
    if (!m) return;
    m.innerHTML = `<div class="melding ${type}">${html}<span class="x" onclick="this.parentNode.remove()">✕</span></div>`;
  }

  async function kloonOrder(orderId, knop) {
    if (!huidigePatient) return;
    knop.disabled = true; knop.textContent = '…';
    try {
      const resp = await fetch(`/api/order/${orderId}/kloon`, { method: 'POST' });
      const r = await resp.json();
      if (!resp.ok || r.fout || !r.order_id) {
        knop.disabled = false; knop.textContent = 'Klonen';
        toonMelding('fout', `✕ Klonen van #${orderId} mislukt: ${esc(r.fout || r.detail || resp.status)}`);
        return;
      }
      // Herlaad de patiënt zodat de nieuwe order in de lijst staat; toon daarna de bestelmail-knop
      await laadPatient(huidigePatient.id, {
        type: 'ok',
        html: `✓ Order #${r.order_id} aangemaakt als kloon van #${orderId} (${esc(r.status || 'pending')}). ` +
              `<button class="btn" id="mailKnop" onclick="stuurBestelmail(${r.order_id}, this)">Bestelmail sturen</button>`
      });
      // Markeer de nieuwe rij
      document.querySelectorAll('.orders-tabel tbody tr').forEach(tr => {
        if (tr.textContent.includes('#' + r.order_id)) tr.classList.add('nieuw');
      });
    } catch (e) {
      knop.disabled = false; knop.textContent = 'Klonen';
      toonMelding('fout', '✕ Klonen mislukt: ' + esc(e.message));
    }
  }

  async function stuurBestelmail(orderId, knop) {
    knop.disabled = true; knop.textContent = 'Versturen…';
    try {
      const resp = await fetch(`/api/order/${orderId}/verstuur-naar-klant`, { method: 'POST' });
      const r = await resp.json();
      if (r.ok) {
        toonMelding('ok', `✓ Bestelmail voor #${orderId} verstuurd naar ${esc(huidigePatient?.email || 'de klant')}${r.methode ? ' (' + esc(r.methode) + ')' : ''}.`);
      } else {
        toonMelding('fout', `✕ Bestelmail voor #${orderId} mislukt: ${esc(r.fout || resp.status)} <button class="btn licht" onclick="stuurBestelmail(${orderId}, this)">Opnieuw</button>`);
      }
    } catch (e) {
      toonMelding('fout', '✕ Bestelmail mislukt: ' + esc(e.message));
    }
  }

  async function slaVoorschrijverOp(patient_id) {
    const st = document.getElementById('vs-status');
    const data = {
      naam: document.getElementById('v-naam').value,
      agb_code: document.getElementById('v-agb').value,
      email: document.getElementById('v-email').value,
      telefoon: document.getElementById('v-telefoon').value,
    };
    const resp = await fetch(`/api/patient/${patient_id}/voorschrijver`, {
      method: 'PUT', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(data)
    });
    const r = await resp.json();
    if (r.ok) {
      await laadPatient(patient_id, {
        type: r.gekoppeld_aan_bestaande ? 'waarsch' : 'ok',
        html: r.gekoppeld_aan_bestaande
          ? '✓ Gekoppeld aan een bestaande voorschrijver met deze AGB-code/naam (bestaande gegevens zijn niet overschreven, alleen lege velden aangevuld).'
          : '✓ Voorschrijver opgeslagen.'
      });
    } else {
      st.style.color = 'var(--danger)';
      st.textContent = '✗ ' + (r.fout || 'Fout');
    }
  }

  async function slaOp(patient_id) {
    const status = document.getElementById('opslaan-status');
    const data = {
      voornaam: document.getElementById('f-voornaam').value,
      achternaam: document.getElementById('f-achternaam').value,
      telefoon: document.getElementById('f-telefoon').value,
      geboortedatum: document.getElementById('f-geboortedatum').value,
      bsn: document.getElementById('f-bsn').value,
      adres: document.getElementById('f-adres').value,
      postcode: document.getElementById('f-postcode').value,
      plaats: document.getElementById('f-plaats').value,
    };
    const resp = await fetch(`/api/patient/${patient_id}`, {
      method: 'PUT',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(data)
    });
    const result = await resp.json();
    if (result.ok) {
      status.style.color = 'var(--success)';
      status.textContent = '✓ Opgeslagen';
      setTimeout(() => status.textContent = '', 3000);
    } else {
      status.style.color = 'var(--danger)';
      status.textContent = '✗ ' + (result.fout || 'Fout');
    }
  }

  async function verwijderPatient(patient_id, naam, samenvoegenMet) {
    if (!samenvoegenMet && !confirm(`Weet je zeker dat je "${naam.trim()}" (patiënt #${patient_id}) wilt verwijderen? Dit kan niet ongedaan worden gemaakt.`)) {
      return;
    }
    const status = document.getElementById('opslaan-status');
    let url = `/api/patient/${patient_id}`;
    if (samenvoegenMet) url += `?samenvoegen_met=${samenvoegenMet}`;
    const resp = await fetch(url, { method: 'DELETE' });
    const result = await resp.json();

    if (result.ok) {
      status.style.color = 'var(--success)';
      status.textContent = `✓ Verwijderd${result.orders_verplaatst ? ` (${result.orders_verplaatst} order(s) verplaatst)` : ''}`;
      setTimeout(() => {
        document.getElementById('datasheet').innerHTML = '<div class="leeg">← Zoek en selecteer een patiënt</div>';
        document.getElementById('zoekInput').value = '';
        document.getElementById('patientLijst').innerHTML = '';
      }, 1200);
    } else if (resp.status === 409 && result.gekoppelde_orders) {
      const idsLijst = result.gekoppelde_orders.join(', ');
      const doel = prompt(
        `Kan niet verwijderen: ${result.gekoppelde_orders.length} order(s) zijn nog gekoppeld aan deze patiënt (order-ID's: ${idsLijst}).\n\n` +
        `Vul het patiënt-ID in waar deze orders naartoe verplaatst moeten worden (het "blijvende" record), of Annuleren om te stoppen:`
      );
      if (doel && !isNaN(parseInt(doel))) {
        verwijderPatient(patient_id, naam, parseInt(doel));
      }
    } else {
      status.style.color = 'var(--danger)';
      status.textContent = '✗ ' + (result.fout || 'Fout');
    }
  }
</script>
</body>
</html>
