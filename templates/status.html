<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Farmamed — Werklijst</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    :root { --teal:#7bb8b8; --teal-dk:#5a9898; --teal-lt:#e8f4f4; --cream:#faf8f5; --text:#2c3e3e; --muted:#7a9090; --border:#dde8e8; --success:#27ae60; --warn:#e67e22; --danger:#c0392b; --radius:10px; }
    * { box-sizing:border-box; margin:0; padding:0; }
    body { font-family:'DM Sans',sans-serif; background:var(--cream); color:var(--text); min-height:100vh; display:flex; flex-direction:column; }
    header { background:var(--teal); padding:10px 24px; display:grid; grid-template-columns:1fr auto 1fr; align-items:center; box-shadow:0 2px 8px rgba(0,0,0,0.08); }
    .nav { display:flex; gap:4px; justify-content:center; }
    .nav a { color:rgba(255,255,255,0.75); text-decoration:none; font-size:13px; font-weight:500; padding:7px 18px; border-radius:6px; transition:all 0.2s; }
    .nav a:hover, .nav a.actief { background:rgba(255,255,255,0.22); color:white; }
    .hoofd { flex:1; padding:20px 24px; max-width:1400px; margin:0 auto; width:100%; }
    .boven { display:flex; align-items:center; justify-content:space-between; margin-bottom:16px; flex-wrap:wrap; gap:10px; }
    .pagina-titel { font-family:'Cormorant Garamond',serif; font-size:24px; font-weight:400; }
    .acties { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
    .btn { padding:7px 14px; border:1px solid var(--border); border-radius:7px; background:white; cursor:pointer; font-size:12px; font-family:'DM Sans',sans-serif; color:var(--text); transition:all 0.15s; }
    .btn:hover { background:var(--teal-lt); border-color:var(--teal); }
    .btn-succes { background:#e8f8ee; color:var(--success); border-color:#b8e8c8; }
    .btn-primair { background:var(--teal); color:white; border-color:var(--teal); }
    .btn:disabled { opacity:0.4; cursor:not-allowed; }
    .filterbalk { display:flex; gap:6px; margin-bottom:14px; flex-wrap:wrap; }
    .filter-btn { padding:5px 12px; border:1px solid var(--border); border-radius:6px; background:white; cursor:pointer; font-size:12px; font-family:'DM Sans',sans-serif; color:var(--muted); }
    .filter-btn.actief { background:var(--teal-lt); border-color:var(--teal); color:var(--teal-dk); font-weight:500; }
    .tabel { background:white; border:1px solid var(--border); border-radius:var(--radius); overflow:hidden; }
    .tabel-header { display:grid; grid-template-columns:32px 110px 150px 90px 110px 1fr 1fr 1fr; gap:8px; padding:10px 16px; background:var(--cream); font-size:11px; font-weight:500; text-transform:uppercase; letter-spacing:0.06em; color:var(--muted); border-bottom:1px solid var(--border); }
    .tabel-rij { display:grid; grid-template-columns:32px 110px 150px 90px 110px 1fr 1fr 1fr; gap:8px; padding:11px 16px; border-bottom:1px solid var(--border); align-items:center; font-size:12px; transition:background 0.1s; }
    .tabel-rij:last-child { border-bottom:none; }
    .tabel-rij:hover { background:#fafafa; }
    .tabel-rij.geselecteerd { background:var(--teal-lt); }
    .status-badge { padding:2px 8px; border-radius:10px; font-size:10px; font-weight:500; display:inline-block; }
    .status-processing { background:#e8f0ff; color:#3a6fd8; }
    .status-pending { background:#fef3e2; color:var(--warn); }
    .status-on-hold { background:#f5f5f5; color:var(--muted); }
    .betaal-badge { padding:2px 8px; border-radius:10px; font-size:11px; font-weight:500; display:inline-block; }
    .betaal-pay { background:#e8f8ee; color:var(--success); }
    .betaal-bank { background:#e8f0ff; color:#3a6fd8; }
    .betaal-anders { background:var(--teal-lt); color:var(--teal-dk); }
    .betaal-niet { background:#fdecea; color:var(--danger); }
    .oorsprong { font-size:10px; font-weight:500; padding:2px 7px; border-radius:10px; background:var(--teal-lt); color:var(--teal-dk); display:inline-block; }
    .filter-btn .tel { margin-left:4px; font-size:10px; background:var(--cream); border-radius:8px; padding:0 6px; color:var(--muted); }
    .filter-btn.actief .tel { background:white; }
    .filter-btn.alarm .tel { background:#fdecea; color:var(--danger); font-weight:500; }
    .vinkje { font-size:16px; text-align:center; cursor:pointer; display:block; }
    .vinkje.klaar { color:var(--success); cursor:default; }
    .vinkje.open { color:var(--border); }
    .vinkje.open:hover { color:var(--teal); }
    .laden { padding:40px; text-align:center; color:var(--muted); font-size:13px; }
    .spinner { width:20px; height:20px; border:2px solid var(--teal-lt); border-top-color:var(--teal); border-radius:50%; animation:spin 0.8s linear infinite; display:inline-block; vertical-align:middle; margin-right:8px; }
    @keyframes spin { to { transform:rotate(360deg); } }
  </style>
</head>
<body>
<header>
  <div style="font-family:'Cormorant Garamond',serif;font-size:20px;font-weight:300;color:white;">Farmamed</div>
  <nav class="nav">
    <a href="/">Balie</a>
    <a href="/orders">Orders</a>
    <a href="/emails">E-mails</a>
    <a href="/zorgmail">Zorgmail</a>
    <a href="/status" class="actief">Werklijst</a>
    <a href="/bank">Bank</a>
    <a href="/patient">Patiënten</a>
  </nav>
  <div></div>
</header>

<div class="hoofd">
  <div class="boven">
    <h1 class="pagina-titel">Werklijst</h1>
    <div class="acties">
      <span id="selectie-info" style="font-size:12px;color:var(--muted);"></span>
<!-- Afronden knop tijdelijk verwijderd - orders worden handmatig afgerond in WooCommerce -->
      <button class="btn" onclick="laadOrders()">↻ Vernieuwen</button>
    </div>
  </div>

  <div class="filterbalk">
    <button class="filter-btn actief" data-f="todo" onclick="setFilter('todo',this)">Te doen<span class="tel"></span></button>
    <button class="filter-btn" data-f="verstrekking" onclick="setFilter('verstrekking',this)">Wacht op verstrekking<span class="tel"></span></button>
    <button class="filter-btn" data-f="betaling" onclick="setFilter('betaling',this)">Wacht op betaling<span class="tel"></span></button>
    <button class="filter-btn" data-f="verzenden" onclick="setFilter('verzenden',this)">Te verzenden<span class="tel"></span></button>
    <button class="filter-btn" data-f="klaar" onclick="setFilter('klaar',this)">Klaar<span class="tel"></span></button>
    <button class="filter-btn" data-f="alle" onclick="setFilter('alle',this)">Alle<span class="tel"></span></button>
  </div>

  <div class="tabel" id="tabel">
    <div class="laden"><span class="spinner"></span>Orders laden…</div>
  </div>
</div>

<script>
  let alleOrders = [];
  let huidigFilter = 'todo';

  // Fase van een order = wat moet er nu mee gebeuren (volgorde = prioriteit):
  //   verstrekking → er is een order maar nog geen verstrekkingsverzoek (route A, of B tussen de twee stappen)
  //   betaling     → verstrekking is er, maar de order is nog niet betaald (B en C)
  //   verzenden    → betaald + verstrekking, nog niet verzonden
  //   klaar        → alles ✓
  function faseVan(o) {
    if (!o.heeft_verstrekking) return 'verstrekking';
    if (o.betaal_type === 'onbetaald') return 'betaling';
    if (!o.verzonden) return 'verzenden';
    return 'klaar';
  }
  function werkTellersBij() {
    const t = { todo: 0, verstrekking: 0, betaling: 0, verzenden: 0, klaar: 0, alle: alleOrders.length };
    alleOrders.forEach(o => { const f = faseVan(o); t[f]++; if (f !== 'klaar') t.todo++; });
    document.querySelectorAll('.filter-btn').forEach(b => {
      const f = b.dataset.f, el = b.querySelector('.tel');
      if (el) el.textContent = t[f];
      b.classList.toggle('alarm', f === 'verstrekking' && t.verstrekking > 0);
    });
  }
  let geselecteerd = new Set();

  // De verstrekkingsstatus komt uit de database (o.heeft_verstrekking) — dezelfde bron als de pagina Orders.
  const bronNl = { smarthub: 'via SmartHUB', handmatig: 'handmatig', verzonden: 'automatisch (verzending gezien)', zorgmail: 'Zorgmail-bericht (is de verstrekking)', 'woocommerce-meta': 'eerder gemarkeerd', admin: 'admin-order' };

  async function laadOrders() {
    document.getElementById('tabel').innerHTML = '<div class="laden"><span class="spinner"></span>Orders laden…</div>';
    geselecteerd.clear(); updateSelectie();
    try {
      const res = await fetch('/bestellingen');
      const data = await res.json();
      if (data.fout) { document.getElementById('tabel').innerHTML = `<div class="laden" style="color:var(--danger)">Fout: ${data.fout}</div>`; return; }
      alleOrders = data.orders || [];
      toonOrders();
      // Haal verzendstatus op na laden (op achtergrond)
      laadVerzending();
    } catch(e) {
      document.getElementById('tabel').innerHTML = `<div class="laden" style="color:var(--danger)">Verbindingsfout: ${e.message}</div>`;
    }
  }

  function setFilter(f, btn) {
    huidigFilter = f;
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('actief'));
    btn.classList.add('actief');
    toonOrders();
  }

  function toonOrders() {
    const statusNl = { processing:'In behandeling', pending:'Wacht op betaling', 'on-hold':'In de wacht' };
    const statusCls = { processing:'status-processing', pending:'status-pending', 'on-hold':'status-on-hold' };
    const betaalCls = { pay:'betaal-pay', bank:'betaal-bank', anders:'betaal-anders', onbetaald:'betaal-niet' };

    werkTellersBij();
    let gefilterd = alleOrders.filter(o => {
      const f = faseVan(o);
      if (huidigFilter === 'todo') return f !== 'klaar';
      if (huidigFilter === 'alle') return true;
      return f === huidigFilter;
    });

    if (gefilterd.length === 0) { document.getElementById('tabel').innerHTML = '<div class="laden">Geen orders gevonden</div>'; return; }

    let html = `<div class="tabel-header"><span></span><span>Order / Datum</span><span>Patiënt</span><span>Oorsprong</span><span>Status</span><span style="text-align:center">Verstrekking</span><span style="text-align:center">Verzonden</span><span>Betaald</span></div>`;

    gefilterd.forEach(o => {
      const sel = geselecteerd.has(o.id);
      const heeftV = o.heeft_verstrekking;
      const isVerzonden = !!o.verzonden;

      const verstrekkingHtml = heeftV
        ? `<span class="vinkje klaar" style="cursor:pointer" onclick="wisVerstrekking(${o.id},this)" title="${(bronNl[o.verstrekking_bron] || o.verstrekking_bron || '') + (o.verstrekking_op ? ' · ' + o.verstrekking_op : '')} — klik om ongedaan te maken">✓</span>`
        : `<span class="vinkje open" onclick="toggleVerstrekking(${o.id},this)" title="Klik om af te vinken">○</span>`;

      const verzondHtml = isVerzonden
        ? (o.tracking_url ? `<a href="${o.tracking_url}" target="_blank" style="color:var(--success);font-size:14px;display:block;text-align:center;">✓</a>` : `<span style="color:var(--success);display:block;text-align:center;">✓</span>`)
        : `<span style="color:var(--border);display:block;text-align:center;">○</span>`;

      html += `<div class="tabel-rij ${sel?'geselecteerd':''}" id="rij-${o.id}">
        <input type="checkbox" ${sel?'checked':''} onchange="toggleSelectie(${o.id},this)" style="cursor:pointer;">
        <div><div style="font-weight:500;">#${o.id}</div><div style="font-size:11px;color:var(--muted);">${o.datum}</div></div>
        <div style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${o.klant_naam||'—'}</div>
        <span><span class="oorsprong">${o.oorsprong || '—'}</span></span>
        <span class="status-badge ${statusCls[o.status]||''}">${statusNl[o.status]||o.status}</span>
        <div id="verstr-${o.id}" style="text-align:center;">${verstrekkingHtml}</div>
        <div id="verzond-${o.id}">${verzondHtml}</div>
        <span class="betaal-badge ${betaalCls[o.betaal_type]||'betaal-anders'}">${o.betaal_status}</span>
      </div>`;
    });

    document.getElementById('tabel').innerHTML = html;
  }

  async function laadVerzending() {
    if (alleOrders.length === 0) return;
    const ids = alleOrders.map(o => o.id);
    try {
      const res = await fetch('/api/verzend-status', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ order_ids: ids })
      });
      const data = await res.json();
      let verstrekkingGewijzigd = false;

      Object.entries(data.resultaten).forEach(([orderId, info]) => {
        const id = parseInt(orderId);
        if (info.verzonden) {
          const ov = alleOrders.find(x => x.id === id);
          if (ov && !ov.verzonden) { ov.verzonden = true; ov.tracking_url = ov.tracking_url || info.tracking_url || ''; verstrekkingGewijzigd = true; }
          // Update verzend icoon via ID
          const verzondCel = document.getElementById('verzond-' + orderId);
          if (verzondCel) {
            verzondCel.innerHTML = info.tracking_url
              ? `<a href="${info.tracking_url}" target="_blank" style="color:var(--success);font-size:14px;display:block;text-align:center;">✓</a>`
              : `<span style="color:var(--success);display:block;text-align:center;">✓</span>`;
          }
          // Zet ook verstrekking vinkje als nog niet aanwezig
          const orderObj = alleOrders.find(x => x.id === id);
          if (orderObj && !orderObj.heeft_verstrekking) {
            fetch('/api/order-verstrekking', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ order_id: id, bron: 'verzonden' })
            });
            orderObj.heeft_verstrekking = true; orderObj.verstrekking_bron = 'verzonden';
            const verstrCel = document.getElementById('verstr-' + orderId);
            if (verstrCel) {
              verstrCel.innerHTML = `<span class="vinkje klaar">✓</span>`;
            }
          }
        }
      });
      if (verstrekkingGewijzigd) toonOrders();   // tellers en fases bijwerken

    } catch(e) {
      console.log('Verzendstatus ophalen mislukt:', e.message);
    }
  }

  async function toggleVerstrekking(id, el) {
    el.textContent = '⏳'; el.style.cursor = 'wait';
    try {
      const d = await (await fetch('/api/order-verstrekking', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ order_id: id, bron: 'handmatig' })
      })).json();
      if (!d.ok) throw new Error(d.fout || 'opslaan mislukt');
      const o = alleOrders.find(x => x.id === id);
      if (o) { o.heeft_verstrekking = true; o.verstrekking_bron = 'handmatig'; }
      toonOrders();
    } catch(e) {
      el.textContent = '○'; el.style.cursor = 'pointer';
    }
  }

  async function wisVerstrekking(id, el) {
    if (!confirm('Verstrekking van order #' + id + ' weer op "nog niet aangemaakt" zetten?')) return;
    el.textContent = '⏳';
    try {
      const d = await (await fetch('/api/order-verstrekking', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ order_id: id, aangemaakt: false })
      })).json();
      if (!d.ok) throw new Error(d.fout || 'mislukt');
      const o = alleOrders.find(x => x.id === id);
      if (o) { o.heeft_verstrekking = false; o.verstrekking_bron = ''; }
      toonOrders();
    } catch (e) { alert('Fout: ' + e.message); toonOrders(); }
  }

  function toggleSelectie(id, cb) {
    if (cb.checked) geselecteerd.add(id); else geselecteerd.delete(id);
    const rij = document.getElementById('rij-'+id);
    if (rij) rij.className = 'tabel-rij '+(cb.checked?'geselecteerd':'');
    updateSelectie();
  }

  function updateSelectie() {
    const info = document.getElementById('selectie-info');
    const btn = document.getElementById('btn-afronden');
    info.textContent = geselecteerd.size > 0 ? geselecteerd.size+' geselecteerd' : '';
  }

  async function rondeAfBatch() {
    const nogOpen = alleOrders.filter(o => geselecteerd.has(o.id) && faseVan(o) !== 'klaar');
    const waarschuwing = nogOpen.length
      ? `\n\nLet op: ${nogOpen.length} van deze order(s) heeft nog openstaande stappen (verstrekking, betaling of verzending): ` + nogOpen.map(o => '#' + o.id).join(', ')
      : '';
    if (!confirm(`${geselecteerd.size} order(s) afronden?${waarschuwing}`)) return;
    const btn = document.getElementById('btn-afronden');
    btn.disabled = true; btn.textContent = '⏳ Bezig…';
    try {
      const res = await fetch('/api/order-afronden', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({order_ids:[...geselecteerd]}) });
      const data = await res.json();
      alert('✓ '+data.resultaten.filter(r=>r.ok).length+' orders afgerond.');
      geselecteerd.clear();
      await laadOrders();
    } catch(e) { alert('Fout: '+e.message); }
    finally { btn.disabled=false; btn.textContent='✓ Afronden in WooCommerce'; updateSelectie(); }
  }

  laadOrders();
</script>
</body>
</html>
