<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Farmamed — Werklijst</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    :root { --teal:#7bb8b8; --teal-dk:#5a9898; --teal-lt:#e8f4f4; --cream:#faf8f5; --text:#2c3e3e; --muted:#7a9090; --border:#dde8e8; --success:#27ae60; --warn:#e67e22; --danger:#c0392b; --radius:10px; }
    * { box-sizing:border-box; margin:0; padding:0; }
    body { font-family:'DM Sans',sans-serif; background:var(--cream); color:var(--text); min-height:100vh; display:flex; flex-direction:column; }
    header { background:var(--teal); padding:10px 24px; display:grid; grid-template-columns:1fr auto 1fr; align-items:center; box-shadow:0 2px 8px rgba(0,0,0,0.08); }
    .nav { display:flex; gap:4px; justify-content:center; }
    .nav a { color:rgba(255,255,255,0.75); text-decoration:none; font-size:13px; font-weight:500; padding:7px 18px; border-radius:6px; transition:all 0.2s; }
    .nav a:hover, .nav a.actief { background:rgba(255,255,255,0.22); color:white; }
    .hoofd { flex:1; padding:20px 24px; max-width:1400px; margin:0 auto; width:100%; }
    .boven { display:flex; align-items:center; justify-content:space-between; margin-bottom:16px; flex-wrap:wrap; gap:10px; }
    .pagina-titel { font-family:'Cormorant Garamond',serif; font-size:24px; font-weight:400; }
    .acties { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
    .btn { padding:7px 14px; border:1px solid var(--border); border-radius:7px; background:white; cursor:pointer; font-size:12px; font-family:'DM Sans',sans-serif; color:var(--text); transition:all 0.15s; }
    .btn:hover { background:var(--teal-lt); border-color:var(--teal); }
    .btn-succes { background:#e8f8ee; color:var(--success); border-color:#b8e8c8; }
    .btn-primair { background:var(--teal); color:white; border-color:var(--teal); }
    .btn:disabled { opacity:0.4; cursor:not-allowed; }
    .filterbalk { display:flex; gap:6px; margin-bottom:14px; flex-wrap:wrap; }
    .filter-btn { padding:5px 12px; border:1px solid var(--border); border-radius:6px; background:white; cursor:pointer; font-size:12px; font-family:'DM Sans',sans-serif; color:var(--muted); }
    .filter-btn.actief { background:var(--teal-lt); border-color:var(--teal); color:var(--teal-dk); font-weight:500; }
    .mt940-balk { background:white; border:1px solid var(--border); border-radius:var(--radius); padding:12px 16px; margin-bottom:14px; display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
    .mt940-matches { background:white; border:1px solid var(--border); border-radius:var(--radius); margin-bottom:14px; overflow:hidden; display:none; }
    .mt940-header { padding:10px 16px; background:var(--cream); border-bottom:1px solid var(--border); display:flex; align-items:center; justify-content:space-between; }
    .tabel { background:white; border:1px solid var(--border); border-radius:var(--radius); overflow:hidden; }
    .tabel-header { display:grid; grid-template-columns:32px 130px 1fr 110px 90px 90px 110px; gap:8px; padding:10px 16px; background:var(--cream); font-size:11px; font-weight:500; text-transform:uppercase; letter-spacing:0.06em; color:var(--muted); border-bottom:1px solid var(--border); }
    .tabel-rij { display:grid; grid-template-columns:32px 130px 1fr 110px 90px 90px 110px; gap:8px; padding:11px 16px; border-bottom:1px solid var(--border); align-items:center; font-size:12px; transition:background 0.1s; }
    .tabel-rij:last-child { border-bottom:none; }
    .tabel-rij:hover { background:#fafafa; }
    .tabel-rij.geselecteerd { background:var(--teal-lt); }
    .status-badge { padding:2px 8px; border-radius:10px; font-size:10px; font-weight:500; display:inline-block; }
    .status-processing { background:#e8f0ff; color:#3a6fd8; }
    .status-pending { background:#fef3e2; color:var(--warn); }
    .status-on-hold { background:#f5f5f5; color:var(--muted); }
    .betaal-badge { padding:2px 8px; border-radius:10px; font-size:11px; font-weight:500; display:inline-block; }
    .betaal-pay { background:#e8f8ee; color:var(--success); }
    .betaal-bank { background:#e8f0ff; color:#3a6fd8; }
    .betaal-anders { background:var(--teal-lt); color:var(--teal-dk); }
    .betaal-niet { background:#fdecea; color:var(--danger); }
    .vinkje { font-size:16px; text-align:center; cursor:pointer; display:block; }
    .vinkje.klaar { color:var(--success); cursor:default; }
    .vinkje.open { color:var(--border); }
    .vinkje.open:hover { color:var(--teal); }
    .laden { padding:40px; text-align:center; color:var(--muted); font-size:13px; }
    .spinner { width:20px; height:20px; border:2px solid var(--teal-lt); border-top-color:var(--teal); border-radius:50%; animation:spin 0.8s linear infinite; display:inline-block; vertical-align:middle; margin-right:8px; }
    @keyframes spin { to { transform:rotate(360deg); } }
  </style>
</head>
<body>
<header>
  <div style="font-family:'Cormorant Garamond',serif;font-size:20px;font-weight:300;color:white;">Farmamed</div>
  <nav class="nav">
    <a href="/">Balie</a>
    <a href="/orders">Orders</a>
    <a href="/emails">E-mails</a>
    <a href="/status" class="actief">Werklijst</a>
  </nav>
  <div></div>
</header>

<div class="hoofd">
  <div class="boven">
    <h1 class="pagina-titel">Werklijst</h1>
    <div class="acties">
      <span id="selectie-info" style="font-size:12px;color:var(--muted);"></span>
      <button class="btn btn-succes" id="btn-afronden" style="display:none" onclick="rondeAfBatch()">✓ Afronden in WooCommerce</button>
      <button class="btn" onclick="laadOrders()">↻ Vernieuwen</button>
    </div>
  </div>

  <div class="filterbalk">
    <button class="filter-btn actief" onclick="setFilter('alle',this)">Alle open</button>
    <button class="filter-btn" onclick="setFilter('pending',this)">Wacht op betaling</button>
    <button class="filter-btn" onclick="setFilter('processing',this)">In behandeling</button>
    <button class="filter-btn" onclick="setFilter('onbetaald',this)">Niet betaald</button>
    <button class="filter-btn" onclick="setFilter('geen-verstrekking',this)">Geen verstrekking</button>
    <button class="filter-btn" onclick="setFilter('niet-verzonden',this)">Niet verzonden</button>
  </div>

  <div class="mt940-balk">
    <span style="font-size:13px;font-weight:500;">🏦 Bankbetalingen importeren</span>
    <label style="display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border:1px solid var(--teal);border-radius:6px;background:var(--teal-lt);color:var(--teal-dk);font-size:12px;cursor:pointer;font-family:'DM Sans',sans-serif;">
      📂 MT940 kiezen
      <input type="file" id="mt940Input" accept=".mt940,.sta,.cat,.txt" style="display:none" onchange="verwerkMT940(this)">
    </label>
    <span id="mt940Status" style="font-size:12px;color:var(--muted);"></span>
  </div>

  <div class="mt940-matches" id="mt940Matches">
    <div class="mt940-header">
      <span style="font-size:13px;font-weight:500;" id="mt940Titel">Gevonden betalingen</span>
      <button class="btn btn-primair" id="btnBevestig" onclick="bevestigBetalingen()" style="display:none;">✓ Verwerken</button>
    </div>
    <div id="mt940Lijst"></div>
  </div>

  <div class="tabel" id="tabel">
    <div class="laden"><span class="spinner"></span>Orders laden…</div>
  </div>
</div>

<script>
  let alleOrders = [];
  let huidigFilter = 'alle';
  let geselecteerd = new Set();
  let mt940Geselecteerd = new Set();

  function getVerstrekkingen() { return JSON.parse(sessionStorage.getItem('farmamed_verstrekkingen') || '[]'); }
  function setVerstrekking(id) {
    const l = getVerstrekkingen();
    if (!l.includes(id)) { l.push(id); sessionStorage.setItem('farmamed_verstrekkingen', JSON.stringify(l)); }
  }

  async function laadOrders() {
    document.getElementById('tabel').innerHTML = '<div class="laden"><span class="spinner"></span>Orders laden…</div>';
    geselecteerd.clear(); updateSelectie();
    try {
      const res = await fetch('/bestellingen');
      const data = await res.json();
      if (data.fout) { document.getElementById('tabel').innerHTML = `<div class="laden" style="color:var(--danger)">Fout: ${data.fout}</div>`; return; }
      alleOrders = data.orders || [];
      toonOrders();
    } catch(e) {
      document.getElementById('tabel').innerHTML = `<div class="laden" style="color:var(--danger)">Verbindingsfout: ${e.message}</div>`;
    }
  }

  function setFilter(f, btn) {
    huidigFilter = f;
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('actief'));
    btn.classList.add('actief');
    toonOrders();
  }

  function toonOrders() {
    const verstrekkingen = getVerstrekkingen();
    const statusNl = { processing:'In behandeling', pending:'Wacht op betaling', 'on-hold':'In de wacht' };
    const statusCls = { processing:'status-processing', pending:'status-pending', 'on-hold':'status-on-hold' };
    const betaalCls = { pay:'betaal-pay', bank:'betaal-bank', anders:'betaal-anders', onbetaald:'betaal-niet' };

    let gefilterd = alleOrders.filter(o => {
      if (huidigFilter === 'pending') return o.status === 'pending';
      if (huidigFilter === 'processing') return o.status === 'processing';
      if (huidigFilter === 'onbetaald') return o.betaal_type === 'onbetaald';
      if (huidigFilter === 'geen-verstrekking') return !verstrekkingen.includes(o.id);
      if (huidigFilter === 'niet-verzonden') return o.verzend_status === 'Niet verzonden';
      return true;
    });

    if (gefilterd.length === 0) { document.getElementById('tabel').innerHTML = '<div class="laden">Geen orders gevonden</div>'; return; }

    let html = `<div class="tabel-header"><span></span><span>Order / Datum</span><span>Patiënt</span><span>Status</span><span style="text-align:center">Verstrekking</span><span style="text-align:center">Verzonden</span><span>Betaald</span></div>`;

    gefilterd.forEach(o => {
      const sel = geselecteerd.has(o.id);
      const heeftV = verstrekkingen.includes(o.id);
      const isVerzonden = o.verzend_status && o.verzend_status !== 'Niet verzonden';

      const verstrekkingHtml = heeftV
        ? `<span class="vinkje klaar">✓</span>`
        : `<span class="vinkje open" onclick="toggleVerstrekking(${o.id},this)" title="Klik om af te vinken">○</span>`;

      const verzondHtml = isVerzonden
        ? (o.tracking_url ? `<a href="${o.tracking_url}" target="_blank" style="color:var(--success);font-size:14px;display:block;text-align:center;">✓</a>` : `<span style="color:var(--success);display:block;text-align:center;">✓</span>`)
        : `<span style="color:var(--border);display:block;text-align:center;">○</span>`;

      html += `<div class="tabel-rij ${sel?'geselecteerd':''}" id="rij-${o.id}">
        <input type="checkbox" ${sel?'checked':''} onchange="toggleSelectie(${o.id},this)" style="cursor:pointer;">
        <div><div style="font-weight:500;">#${o.id}</div><div style="font-size:11px;color:var(--muted);">${o.datum}</div></div>
        <div style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${o.klant_naam||'—'}</div>
        <span class="status-badge ${statusCls[o.status]||''}">${statusNl[o.status]||o.status}</span>
        <div style="text-align:center;">${verstrekkingHtml}</div>
        <div>${verzondHtml}</div>
        <span class="betaal-badge ${betaalCls[o.betaal_type]||'betaal-anders'}">${o.betaal_status}</span>
      </div>`;
    });

    document.getElementById('tabel').innerHTML = html;
  }

  function toggleVerstrekking(id, el) {
    setVerstrekking(id);
    el.textContent = '✓'; el.className = 'vinkje klaar'; el.onclick = null;
  }

  function toggleSelectie(id, cb) {
    if (cb.checked) geselecteerd.add(id); else geselecteerd.delete(id);
    const rij = document.getElementById('rij-'+id);
    if (rij) rij.className = 'tabel-rij '+(cb.checked?'geselecteerd':'');
    updateSelectie();
  }

  function updateSelectie() {
    const info = document.getElementById('selectie-info');
    const btn = document.getElementById('btn-afronden');
    info.textContent = geselecteerd.size > 0 ? geselecteerd.size+' geselecteerd' : '';
    btn.style.display = geselecteerd.size > 0 ? 'inline-flex' : 'none';
  }

  async function rondeAfBatch() {
    if (!confirm(`${geselecteerd.size} order(s) afronden?`)) return;
    const btn = document.getElementById('btn-afronden');
    btn.disabled = true; btn.textContent = '⏳ Bezig…';
    try {
      const res = await fetch('/api/order-afronden', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({order_ids:[...geselecteerd]}) });
      const data = await res.json();
      alert('✓ '+data.resultaten.filter(r=>r.ok).length+' orders afgerond.');
      geselecteerd.clear();
      await laadOrders();
    } catch(e) { alert('Fout: '+e.message); }
    finally { btn.disabled=false; btn.textContent='✓ Afronden in WooCommerce'; updateSelectie(); }
  }

  async function verwerkMT940(input) {
    if (!input.files[0]) return;
    const status = document.getElementById('mt940Status');
    status.textContent = '⏳ Verwerken…'; status.style.color = 'var(--muted)';
    const fd = new FormData(); fd.append('bestand', input.files[0]);
    try {
      const res = await fetch('/api/verwerk-mt940', { method:'POST', body:fd });
      const data = await res.json();
      if (data.fout) { status.textContent = '✕ '+data.fout; status.style.color='var(--danger)'; return; }
      status.textContent = `✓ ${data.betalingen} betalingen, ${data.gematcht} gematcht`;
      status.style.color = 'var(--success)';
      toonMT940Matches(data.matches);
    } catch(e) { status.textContent = '✕ '+e.message; status.style.color='var(--danger)'; }
  }

  function toonMT940Matches(matches) {
    mt940Geselecteerd.clear();
    document.getElementById('mt940Matches').style.display = 'block';
    document.getElementById('mt940Titel').textContent = matches.length+' betalingen gevonden';
    let html = `<div style="display:grid;grid-template-columns:32px 100px 80px 1fr 1fr 60px;gap:8px;padding:9px 16px;background:var(--cream);font-size:11px;font-weight:500;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--border);"><span></span><span>Datum</span><span>Bedrag</span><span>Afzender</span><span>Order match</span><span>Score</span></div>`;
    matches.forEach(m => {
      const b=m.betaling, o=m.order;
      const kleur = m.score>=80?'var(--success)':m.score>=50?'var(--warn)':'var(--danger)';
      const checked = m.gematcht && m.score>=70;
      if (checked && o) mt940Geselecteerd.add(o.id);
      html += `<div style="display:grid;grid-template-columns:32px 100px 80px 1fr 1fr 60px;gap:8px;padding:10px 16px;border-bottom:1px solid var(--border);align-items:center;font-size:12px;${checked?'background:var(--teal-lt);':''}">
        <input type="checkbox" ${checked?'checked':''} ${!o?'disabled':''} onchange="toggleMT940(${o?o.id:'null'},this)" style="cursor:${o?'pointer':'not-allowed'};">
        <span>${b.datum}</span><span style="font-weight:600;">€${b.bedrag.toFixed(2)}</span>
        <span style="color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${b.naam||b.omschrijving?.slice(0,30)||'—'}</span>
        <div>${o?`<strong>#${o.id}</strong> ${o.klant_naam} <span style="color:var(--muted)">€${o.totaal}</span>`:'<span style="color:var(--muted)">Geen match</span>'}</div>
        <span style="font-weight:600;color:${kleur}">${m.score}%</span>
      </div>`;
    });
    document.getElementById('mt940Lijst').innerHTML = html;
    updateMT940Knop();
  }

  function toggleMT940(id, cb) {
    if (id===null) return;
    if (cb.checked) mt940Geselecteerd.add(id); else mt940Geselecteerd.delete(id);
    cb.closest('div').style.background = cb.checked?'var(--teal-lt)':'';
    updateMT940Knop();
  }

  function updateMT940Knop() {
    const btn = document.getElementById('btnBevestig');
    btn.style.display = mt940Geselecteerd.size>0?'inline-flex':'none';
    btn.textContent = `✓ ${mt940Geselecteerd.size} betaling(en) verwerken`;
  }

  async function bevestigBetalingen() {
    if (!confirm(`${mt940Geselecteerd.size} order(s) als betaald markeren?`)) return;
    const btn = document.getElementById('btnBevestig');
    btn.disabled=true; btn.textContent='⏳ Bezig…';
    try {
      const res = await fetch('/api/betalingen-verwerken', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({order_ids:[...mt940Geselecteerd]}) });
      const data = await res.json();
      alert('✓ '+data.resultaten.filter(r=>r.ok).length+' orders als betaald gemarkeerd.');
      document.getElementById('mt940Matches').style.display='none';
      document.getElementById('mt940Status').textContent='';
      document.getElementById('mt940Input').value='';
      mt940Geselecteerd.clear();
      await laadOrders();
    } catch(e) { alert('Fout: '+e.message); }
    finally { btn.disabled=false; updateMT940Knop(); }
  }

  laadOrders();
</script>
</body>
</html>
